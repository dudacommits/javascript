<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculadora</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/ca7100e5dd.js" crossorigin="anonymous"></script>
</head>
<body>
    <main>
        <h1><i class="fa-solid fa-calculator"></i> calculadora</h1>
        <div id="operacoes">
            numero 
        </div>
        <div class="topo">C</div>
        <div class="topo">CE</div>
        <div class="topo"><i class="fa-solid fa-percent"></i></div>
        <div class="lat"><i class="fa-solid fa-divide"></i></div>
        <div class="number">7</div>
        <div class="number">8</div>
        <div class="number">9</div>
        <div class="lat"><i class="fa-solid fa-xmark"></i></div>
        <div class="number">4</div>
        <div class="number">5</div>
        <div class="number">6</div>
        <div class="lat"><i class="fa-solid fa-minus"></i></div>
        <div class="number">1</div>
        <div class="number">2</div>
        <div class="number">3</div>
        <div class="lat"><i class="fa-solid fa-plus"></i></div>
        <div id="zero" class="number">0</div>
        <div class="number">.</div>
        <div class="lat"><i class="fa-solid fa-equals"></i></div>
    </main>
    <script>
        var visor = document.getElementById('operacoes')
        var botao = document.querySelectorAll('.number')
        botao.addEventListener('click', clicou)
        function clicou(){
            var numeroclicado = Number(botao.innerText)
            visor.innerHTML = numeroclicado
        }
    </script>
</body>
</html>
