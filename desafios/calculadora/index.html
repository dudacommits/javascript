<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculadora</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://kit.fontawesome.com/ca7100e5dd.js" crossorigin="anonymous"></script>
</head>
<body>
    <main>
        <h1><i class="fa-solid fa-calculator"></i> calculadora</h1>
        <div id="operacoes">
            <div id="op"></div>
            <div id="numesc"></div>
        </div>
        </div>
        <div class="button topo">C</div>
        <div class="button topo">CE</div>
        <div  class="button topo" id="porcentagem">%</div>

        <div class="button lat" id="dividir">÷</div>
        <div class="button number">7</div>
        <div class="button number">8</div>
        <div class="button number">9</div>
        <div class="button lat" id="multiplicar">x</div>

        <div class="button number">4</div>
        <div class="button number">5</div>
        <div class="button number">6</div>
        <div class="button lat" id="diminuir">-</div>

        <div class="button number">1</div>
        <div class="button number">2</div>
        <div class="button number">3</div>
        <div class="button lat" id="somar">+</div>

        <div class="button number" id="zero">0</div>
        <div class="button number">.</div>
        <div class="button lat" id="finalizar">=</div>
        
    </main>
    <script src="script.js"></script>
</body>
</html>
