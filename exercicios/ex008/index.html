<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DETRAN</title>
</head>
<body>
    <h1>sistema de nacionalidae</h1>
    seu pais de origem: <input type="text" name="pais" id="pais">

    <input type="button" value="verificar" onclick="verificar()">
    <div id="res">

    </div>

    <script>
        
        function verificar(){
            var pais = window.document.getElementById('pais')
            var res = window.document.getElementById('res')
            var nacionalidade = String(pais.value)
            if (nacionalidade=='brasil'){
                res.innerHTML = 'voce e brasileiro!'
            } else{
                res.innerHTML = 'voce e estrangeiro!'
            }
        }
    </script>
</body>
</html>
