<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <script>
        var nome = window.prompt('digite seu nome')
        document.write(`ola ${nome}, seu nome tem ${nome.length} letras <br>`)
        document.write(`seu nome em maiusculas e ${nome.toUpperCase()}`)
        document.write(`seu nome em minusculas e ${nome.toLowerCase()} <br>`)
    </script>
</body>
</html>
