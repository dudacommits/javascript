<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mercado</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Lista De Produtos</h1>
</header>

<main>
    <section>
        <h2>Adicionar Produtos</h2>
        <div id="registro">
            
            <p><input type="text" name="item" id="item" placeholder="Nome do item:"></p>
            <p><input type="number" name="preco" id="preco" placeholder="Valor:"></p>
            <p><input type="number" name="quantidade" id="quantidade" placeholder="Quantidade: "></p>
            <input type="button" value="adicionar" id="add"> 
        </div>
        <div class="produto">
            <p class="nit">item: mouse</p> <p class="val">valor: R$50</p> <p class="est">estoque: 40</p>
        </div>
    </section>
</main>

<script src="script.js"></script>
    
</body>
</html>
