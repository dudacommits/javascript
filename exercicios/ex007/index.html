<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>somador</title>
    <style>
        body{
            background-color: rgb(187, 114, 154);
            color: white;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            font-size: 1.2em;
            
            main{
                display:grid;
                grid-template-columns: 1fr 1fr 1fr;
                grid-template-rows: 80px 100px 80px;
                justify-content: center;
                align-items: center;
                height: 100vh;
                width: 100vw;
                gap: 5px;
            }
            main h1{
                grid-column: 1 / -1;
                text-align: center;
            }

            main>div#numeros{
                grid-column: 2 / 3;
                grid-row: 2 / 3;
                text-align: center;
            }

            input#t1, input#t2{
                background-color: rgb(250, 213, 219);
                border: 2px solid rgb(238, 129, 187);
                border-radius: 10px;
                width: 50px;
                height: 50px;
            }

            #r{
                font-weight: 700;
             font-size: 1.1em;
             color: rgb(252, 224, 238);
            }

            input#somar{
                grid-column: 2 / 3;
                grid-row: 3 / -1;
                place-items: center center;
                padding: 8px 25px;
                font-size: 1.1em;
                color: white;
                background-color: rgb(204, 17, 117);
                border: 2px solid rgb(173, 18, 101);
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>somador</h1>
        <div id="numeros">
            <input type="number" name="t1" id="t1"> +
            <input type="number" name="t2" id="t2"> =
            <span id="r">resultado</span>
            
        </div>
        <input type="button" value="somar" id="somar" onclick="somar()">
    </main>
    <script>
        function somar(){
        var res = window.document.getElementById('r')
        var tn1 = window.document.getElementById('t1')
        var tn2 = window.document.getElementById('t2')
        n1 = Number(tn1.value)
        n2 = Number(tn2.value)
        s = n1 + n2
        res.innerText = s}
    </script>
</body>
</html>
